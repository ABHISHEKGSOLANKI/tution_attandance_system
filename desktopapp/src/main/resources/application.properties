spring.application.name=biometric-attendance-middleware
server.port=8090

spring.datasource.url=jdbc:mysql://localhost:3306/biometric_middleware?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.com.tuition.desktopapp=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

middleware.encryption.secret-key=change-this-to-a-secure-32-char-secret
middleware.backend.base-url=http://localhost:8082
middleware.backend.attendance-bulk-path=/api/attendance/bulk
middleware.backend.api-key=

middleware.fingerprint.sdk-enabled=false
middleware.fingerprint.sdk-library-path=C:/sdk/vendor-fingerprint.dll
middleware.fingerprint.matching-threshold=95

middleware.schedule.zone=Asia/Kolkata
middleware.schedule.sync-cron=0 0 20 * * *
middleware.schedule.cleanup-cron=0 0 1 * * *
