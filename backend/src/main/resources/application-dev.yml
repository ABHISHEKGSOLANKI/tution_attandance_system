server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /tutionattendancesystemdev/api

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tuition_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

logging:
  level:
    com.tuition.attendance: INFO

app:
  profile-name: dev
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}
      - ${FACE_SERVICE_ORIGIN:http://localhost:8095}
