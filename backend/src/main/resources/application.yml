server:
  port: 8082

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tuition_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:abhishek.solanki.dev11@gmail.com}
    password: ${MAIL_PASSWORD:xgmqftpuilgxhyqc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjdXJlLWF0dGVuZGFuY2Utand0LXNlY3JldC1rZXktZm9yLWRlbW8=}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:600}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8095
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    public-path: /uploads
  attendance-requests:
    auto-approve-cron: ${ATTENDANCE_AUTO_APPROVE_CRON:0 0 1 * * *}
