server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tuition_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:1234567890}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  jwt:
    secret: ${JWT_SECRET:1234567890}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:600}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    public-path: /uploads
  attendance-requests:
    auto-approve-cron: ${ATTENDANCE_AUTO_APPROVE_CRON:0 0 1 * * *}
  app:
    profile-name: ${ENV:dev}
    cors:
      allowed-origins:
        - ${FRONTEND_ORIGIN:http://localhost:5173}
        - ${FACE_SERVICE_ORIGIN:http://localhost:8091}
